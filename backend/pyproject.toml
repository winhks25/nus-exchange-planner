[project]
name = "nus-exchange-planner-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
